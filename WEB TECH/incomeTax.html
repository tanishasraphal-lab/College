<!DOCTYPE html>
<html>
<head>
    <title>Income Tax Calculator</title>

    <style>
        body{
            font-family: Arial;
            text-align:center;
            margin-top:50px;
            background:#f4f4f4;
        }

        .container{
            width:400px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px;
        }

        button{
            padding:10px 20px;
            font-size:16px;
            cursor:pointer;
        }

        h3{
            color:blue;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Income Tax Calculator</h2>

    <input type="number" id="income"
           placeholder="Enter Annual Income">

    <br>

    <button onclick="calculateTax()">
        Calculate Tax
    </button>

    <h3 id="result"></h3>

</div>

<script>

function calculateTax(){

    let income =
    parseFloat(document.getElementById("income").value);

    let tax = 0;

    if(income <= 400000){
        tax = 0;
    }
    else if(income <= 800000){
        tax = (income - 400000) * 0.05;
    }
    else if(income <= 1200000){
        tax = 20000 + (income - 800000) * 0.10;
    }
    else if(income <= 1600000){
        tax = 60000 + (income - 1200000) * 0.15;
    }
    else if(income <= 2000000){
        tax = 120000 + (income - 1600000) * 0.20;
    }
    else if(income <= 2400000){
        tax = 200000 + (income - 2000000) * 0.25;
    }
    else{
        tax = 300000 + (income - 2400000) * 0.30;
    }

    document.getElementById("result").innerHTML =
    "Income Tax = ₹ " + tax.toFixed(2);
}

</script>

</body>
</html>
