<!DOCTYPE html>
<html>

<head>

<title>Student Registration Form</title>

<style>

body{
font-family:Arial;
background:#e6f2ff;
}

.container{
width:500px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
}

h2{
text-align:center;
color:darkblue;
}

label{
font-weight:bold;
}

input,select{
width:100%;
padding:8px;
margin-top:5px;
margin-bottom:15px;
}

.buttons{
text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h2>Student Registration Form</h2>

<form>

<label>Student Name</label>

<input type="text" required>

<label>Registration Number</label>

<input type="text" required>

<label>Branch</label>

<select>

<option>CSE</option>

<option>ECE</option>

<option>EEE</option>

<option>Mechanical</option>

<option>Civil</option>

</select>

<label>Events</label><br>

<input type="checkbox"> Coding Competition<br>

<input type="checkbox"> Paper Presentation<br>

<input type="checkbox"> Workshop<br>

<input type="checkbox"> Quiz<br><br>

<div class="buttons">

<input type="submit" value="Submit">

<input type="reset" value="Reset">

</div>

</form>

</div>

</body>

</html>
