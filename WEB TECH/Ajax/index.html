<!DOCTYPE html>
<html>
<head>
    <title>AJAX JSON</title>
</head>

<body>

<h2>Student Data</h2>

<button type="button" onclick="loadData()">
    Load Data
</button>

<div id="result"></div>

<script>

function loadData() {

    document.getElementById("result").innerHTML = "Loading...";

    var xhr = new XMLHttpRequest();

    xhr.open("GET", "./student.json", true);

    xhr.onload = function () {

        if (xhr.status === 200) {

            var data = JSON.parse(xhr.responseText);

            var output = "";

            for (var i = 0; i < data.length; i++) {

                output += "<h3>Student " + (i + 1) + "</h3>";

                output += "Name: " + data[i].name + "<br>";

                output += "Age: " + data[i].age + "<br>";

                output += "CGPA: " + data[i].cgpa + "<br>";
            }

            document.getElementById("result").innerHTML = output;

        } else {

            document.getElementById("result").innerHTML =
            "Error: JSON file not found. Status = " + xhr.status;
        }
    };

    xhr.onerror = function () {

        document.getElementById("result").innerHTML =
        "AJAX Error. Run using Live Server.";
    };

    xhr.send();
}

</script>

</body>
</html>
